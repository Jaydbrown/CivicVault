specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CivicVaultFactory
    network: arc-testnet
    source:
      address: "0x58ff8ca3b9863e535845f58d5d7aa90b33fe635f"
      abi: CivicVaultFactory
      startBlock: 60010770
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
        - DaoCreatedEvent
      abis:
        - name: CivicVaultFactory
          file: ./abis/CivicVaultFactory.json
        - name: CivicVault
          file: ./abis/CivicVault.json
      eventHandlers:
        - event: DAOCreated(indexed address,string,string,indexed address,uint256)
          handler: handleDAOCreated
      file: ./src/factory.ts
  - kind: ethereum
    name: CivicVaultGovernor
    network: arc-testnet
    source:
      # Singleton governance contract. Replace address + startBlock after the
      # audit-cycle redeploy, then `graph codegen && graph build && deploy`.
      address: "0x1ce8328e08a4c93a37e5e03115bade0373b97310"
      abi: CivicVaultGovernor
      startBlock: 60010770
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
        - GovernanceProposal
        - GovernanceVote
      abis:
        - name: CivicVaultGovernor
          file: ./abis/CivicVaultGovernor.json
      eventHandlers:
        - event: ProposalCreated(indexed address,indexed uint256,uint8,indexed address,address,uint256,uint256)
          handler: handleProposalCreated
        - event: ProposalVoteCast(indexed address,indexed uint256,indexed address,bool,uint256)
          handler: handleProposalVoteCast
        - event: ProposalExecuted(indexed address,indexed uint256,bool)
          handler: handleProposalExecuted
      file: ./src/governor.ts
templates:
  - kind: ethereum
    name: CivicVault
    network: arc-testnet
    source:
      abi: CivicVault
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - DAO
        - Member
        - Investment
        - Vote
        - YieldClaim
        - PhaseRelease
        - YieldProposal
        - InvestmentCreatedEvent
        - VoteCastEvent
        - YieldDepositedEvent
        - StakeWithdrawnEvent
        - FundsLockedEvent
      abis:
        - name: CivicVault
          file: ./abis/CivicVault.json
      eventHandlers:
        - event: MemberAdded(indexed address,uint256)
          handler: handleMemberAdded
        - event: MemberKYCVerified(indexed address,uint256)
          handler: handleMemberKYCVerified
        - event: MemberRemoved(indexed address,uint256)
          handler: handleMemberRemoved
        - event: InvestmentCreated(indexed uint256,string,uint256,uint8,uint256)
          handler: handleInvestmentCreated
        - event: InvestmentActivated(indexed uint256,uint256)
          handler: handleInvestmentActivated
        - event: InvestmentIncomplete(indexed uint256,uint256)
          handler: handleInvestmentIncomplete
        - event: InvestmentClosed(indexed uint256,uint256)
          handler: handleInvestmentClosed
        - event: VoteCast(indexed uint256,indexed address,uint256,uint8,uint256)
          handler: handleVoteCast
        - event: StakeWithdrawn(indexed uint256,indexed address,uint256)
          handler: handleStakeWithdrawn
        - event: FundsLocked(indexed uint256,uint256)
          handler: handleFundsLocked
        - event: FundsReleased(indexed uint256,uint8,uint256,indexed address,uint256)
          handler: handleFundsReleased
        - event: YieldDeposited(indexed uint256,uint256,string,uint256)
          handler: handleYieldDeposited
        - event: YieldClaimed(indexed uint256,indexed address,uint256,uint256)
          handler: handleYieldClaimed
        - event: YieldDepositProposed(indexed uint256,indexed uint256,uint256,address,uint256)
          handler: handleYieldDepositProposed
        - event: YieldDepositApproved(indexed uint256,indexed address,uint256)
          handler: handleYieldDepositApproved
        - event: YieldDepositExecuted(indexed uint256,indexed uint256,uint256,string,uint256)
          handler: handleYieldDepositExecuted
        - event: ReleaseFrozen(indexed uint256,uint256)
          handler: handleReleaseFrozen
        - event: ReleaseUnfrozen(indexed uint256)
          handler: handleReleaseUnfrozen
        - event: InvestmentClawedBack(indexed uint256,uint256,uint256)
          handler: handleInvestmentClawedBack
        - event: ClawbackReclaimed(indexed uint256,indexed address,uint256)
          handler: handleClawbackReclaimed
        - event: YieldFeeSkimmed(indexed uint256,indexed uint256,uint256,address)
          handler: handleYieldFeeSkimmed
      file: ./src/civicVault.ts
